spring.application.name=${APP_NAME:kubee-pos}
# Shop time zone: set with the POS_TIMEZONE env var (default Asia/Kolkata), applied in PosApplication.main
server.port=${PORT:8086}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA - schema is owned by Flyway, Hibernate only validates
spring.jpa.hibernate.ddl-auto=${JPA_DDL:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:pos}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.schemas=${DB_SCHEMA:pos}
spring.flyway.default-schema=${DB_SCHEMA:pos}
spring.flyway.create-schemas=true
# Adopt a pre-existing schema (created before Flyway) as V1; no-op once history table exists
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Actuator
management.endpoints.web.exposure.include=health,info


# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
